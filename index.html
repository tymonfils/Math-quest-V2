<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Scales the 1280px game stage proportionally on mobile screens -->
  <meta name="viewport" content="width=1280, user-scalable=no, viewport-fit=cover">
  
  <!-- Enables full-screen Web App mode when added to iPhone/Android Home Screen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  
  <title>Math Quest</title>
  
  <!-- Themed Google Fonts: Master Nunito + 8 Biome Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bubblegum+Sans&family=Coda&family=Creepster&family=Emilys+Candy&family=Henny+Penny&family=Nunito:wght@400;700;900&family=Orbitron:wght@700&family=Pirata+One&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #0f172a;
      touch-action: manipulation;
      -webkit-text-size-adjust: 100%;
      overscroll-behavior: none;
    }

    /* Fix for Boss Arena overlays which use 100vw/100vh in JS */
    #boss-arena-overlay {
      width: 100% !important;
      height: 100% !important;
    }
  </style>
</head>
<body>
  <!-- 1. Base Game Layer -->
  <div id="game-container" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;"></div>
  
  <!-- 2. World Map Layer -->
  <div id="world-map-layer" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none;"></div>

  <!-- 3. Global UI Layer -->
  <div id="ui-layer" style="position: relative; z-index: 9000; pointer-events: none;"></div>

  <!-- 4. Modal Layer -->
  <div id="modal-layer" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; pointer-events: none;"></div>

  <!-- Scripts -->
  <script src="economy.js"></script>
  <script src="zones.js"></script>
  <script src="uibar.js?v=4"></script>
  <script src="mapmodal.js"></script>
  <script src="settingsmodal.js"></script>
  <script src="bossArena.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
